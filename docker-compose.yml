services:
  postgres:
    image: postgres:16-alpine
    container_name: sptdelays-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sptdelays}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-sptdelays}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sptdelays_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sptdelays}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sptdelays_pgdata:

